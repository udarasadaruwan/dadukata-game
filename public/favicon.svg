<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#FFE3C2"/>

  <!-- Dice (rounded square) -->
  <rect x="14" y="14" width="28" height="28" rx="7" fill="#FFFFFF" stroke="#E8A857" stroke-width="2.5"/>

  <!-- Dice pips (showing 5) -->
  <circle cx="21" cy="21" r="2.6" fill="#4A3B2A"/>
  <circle cx="35" cy="21" r="2.6" fill="#4A3B2A"/>
  <circle cx="28" cy="28" r="2.6" fill="#4A3B2A"/>
  <circle cx="21" cy="35" r="2.6" fill="#4A3B2A"/>
  <circle cx="35" cy="35" r="2.6" fill="#4A3B2A"/>

  <!-- Little snake curling around bottom-right -->
  <path d="M 40 46 Q 48 44 46 38 Q 44 34 50 34 Q 55 34 53 40"
        fill="none" stroke="#5BA85B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Snake head -->
  <circle cx="53" cy="40" r="4" fill="#5BA85B"/>
  <circle cx="54.3" cy="38.7" r="0.9" fill="#2E3B2E"/>
  <!-- Tongue -->
  <path d="M 56.5 41.5 L 59 43" stroke="#D9534F" stroke-width="1.2" stroke-linecap="round"/>
</svg>
